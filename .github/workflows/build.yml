
      - name: Extract and Find Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/uda-source"
          EXTRACT_DIR="$RUNNER_TEMP/uda-extracted"
          mkdir -p "$SOURCE_DIR" "$EXTRACT_DIR"

          APP_DIR=""

          # Pehle repository mein Flutter app dhoondo
          while IFS= read -r -d '' file; do
            dir="${file%/pubspec.yaml}"
            if [ -f "$dir/lib/main.dart" ]; then
              APP_DIR="$dir"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
            -type f -name pubspec.yaml \
            -not -path '*/.git/*' \
            -not -path '*/.dart_tool/*' -print0)

          # Agar repository mein app na mile to ZIP extract karo
          if [ -z "$APP_DIR" ]; then
            while IFS= read -r -d '' archive; do
              DEST="$EXTRACT_DIR/$(basename "$archive" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$archive" -d "$DEST"

              while IFS= read -r -d '' file; do
                dir="${file%/pubspec.yaml}"
                if [ -f "$dir/lib/main.dart" ]; then
                  APP_DIR="$dir"
                  break
                fi
              done < <(find "$DEST" \
                -type f -name pubspec.yaml \
                -not -path '*/.dart_tool/*' -print0)

              [ -n "$APP_DIR" ] && break
            done < <(find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0)
          fi

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Flutter app nahi mili."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          echo "Flutter project found: $APP_DIR"

          # App ko expected shared_app folder mein copy karo
          mkdir -p "$SOURCE_DIR/shared_app"
          cp -a "$APP_DIR/." "$SOURCE_DIR/shared_app/"

          if [ ! -f "$SOURCE_DIR/shared_app/pubspec.yaml" ] || \
             [ ! -f "$SOURCE_DIR/shared_app/lib/main.dart" ]; then
            echo "ERROR: Flutter source copy nahi ho saka."
            exit 1
          fi

          echo "Flutter source successfully prepared."
