
name: Build Universal Device Agent

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android project
        working-directory: shared_app
        run: |
          flutter create --platforms=android --org com.deviceagent --project-name shared_app .
          rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
          rm -rf android/app/src/main/kotlin/com/example
          flutter pub get
      - name: Build APK
        working-directory: shared_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: shared_app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Windows project
        working-directory: shared_app
        run: flutter create --platforms=windows --org com.deviceagent --project-name shared_app .
      - name: Build EXE application
        working-directory: shared_app
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: shared_app/build/windows/x64/runner/Release/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Linux project
        working-directory: shared_app
        run: flutter create --platforms=linux --org com.deviceagent --project-name shared_app .
      - name: Build Linux app
        working-directory: shared_app
        run: |
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-App
          path: shared_app/build/linux/x64/release/bundle/
