
name: Backend Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "control_api/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Check Railway Secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing RAILWAY_TOKEN secret"
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Missing RAILWAY_SERVICE_ID variable"
            exit 1
          fi

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Deploy Backend
        working-directory: control_api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          railway up --service "$RAILWAY_SERVICE_ID" --detach
