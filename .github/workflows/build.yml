
name: Build Universal Device Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "APK/**"
      - "EXE/**"
      - "OS/**"
      - "Backend/**"
      - "Website/**"
      - ".github/workflows/build-all.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze code
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Compile backend
        run: dart compile exe bin/server.dart -o ../backend-server

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-x64
          path: backend-server
          if-no-files-found: error

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APK/shared_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: flutter create --platforms=android --org com.deviceagent --project-name shared_app .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=CONTROL_API_URL=${{ vars.CONTROL_API_URL || 'http://localhost:8080' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-android-apk
          path: APK/shared_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EXE/shared_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows files
        run: flutter create --platforms=windows --org com.deviceagent --project-name shared_app .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release --dart-define=CONTROL_API_URL=${{ vars.CONTROL_API_URL || 'http://localhost:8080' }}

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-windows
          path: EXE/shared_app/build/windows/x64/runner/Release/**
          if-no-files-found: error

  linux-build:
    name: Build Linux application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OS/shared_app

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux files
        run: flutter create --platforms=linux --org com.deviceagent --project-name shared_app .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Linux application
        run: flutter build linux --release --dart-define=CONTROL_API_URL=${{ vars.CONTROL_API_URL || 'http://localhost:8080' }}

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-linux
          path: OS/shared_app/build/linux/x64/release/bundle/**
          if-no-files-found: error

  website:
    name: Package Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify website
        run: test -s Website/index.html

      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-website
          path: Website/**
          if-no-files-found: error
